name: CI
name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok.zip"
          Expand-Archive -Path "C:\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          C:\ngrok\ngrok.exe version
        shell: powershell

      - name: Auth
        run: |
          $configDir = Join-Path $env:LOCALAPPDATA "ngrok"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force | Out-Null }
          C:\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
          Write-Host "RDP ready"
        shell: powershell

      - name: Start Tunnel, Get Address & Keep Alive
        run: |
          $outLog = "C:\ngrok_out.log"
          $errLog = "C:\ngrok_err.log"

          # Start ngrok with its OWN hidden window so it survives this step
          $proc = Start-Process `
            -FilePath "C:\ngrok\ngrok.exe" `
            -ArgumentList @("tcp", "3389") `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog

          Write-Host "ngrok PID: $($proc.Id)"
          Start-Sleep -Seconds 15

          if ($proc.HasExited) {
            Write-Host "ERROR: ngrok crashed immediately!"
            Write-Host "--- stdout ---"; if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "--- stderr ---"; if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }

          # Poll the ngrok API for the public URL
          $url = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-RestMethod "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($r.tunnels.Count -gt 0) {
                $url = $r.tunnels[0].public_url
                break
              }
            } catch {
              Write-Host "Attempt $i/30 - waiting for tunnel..."
            }
          }

          if ($url) {
            $c = ($url -replace "tcp://","").Split(":")
            Write-Host ""
            Write-Host "================================"
            Write-Host " ADDRESS  : $($c[0])"
            Write-Host " PORT     : $($c[1])"
            Write-Host " USERNAME : runneradmin"
            Write-Host " PASSWORD : P@ssw0rd!"
            Write-Host "================================"
          } else {
            Write-Host "FAILED: Could not retrieve tunnel URL."
            Write-Host "--- stdout ---"; if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "--- stderr ---"; if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }

          # Keep the runner alive (and ngrok with it) for 6 hours max
          Write-Host "Keeping alive..."
          Start-Sleep -Seconds 21600
        shell: powershell
