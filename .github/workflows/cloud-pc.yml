name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok.zip"
          Expand-Archive -Path "C:\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          C:\ngrok\ngrok.exe version
        shell: powershell

      - name: Auth
        run: C:\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
          Write-Host "RDP ready"
        shell: powershell

      - name: Start Tunnel
        run: |
          $proc = Start-Process `
            -FilePath "C:\ngrok\ngrok.exe" `
            -ArgumentList @("tcp", "3389", "--log=C:\ngrok.log") `
            -NoNewWindow -PassThru
          Write-Host "PID: $($proc.Id)"
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "ngrok crashed — log:"
            Get-Content C:\ngrok.log
            exit 1
          }
          Write-Host "ngrok alive"
        shell: powershell

      - name: Get Address
        run: |
          $url = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-RestMethod "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($r.tunnels.Count -gt 0) { $url = $r.tunnels[0].public_url; break }
            } catch { Write-Host "Attempt $i/30" }
          }
          if ($url) {
            $c = ($url -replace "tcp://","").Split(":")
            Write-Host ""
            Write-Host "================================"
            Write-Host " ADDRESS  : $($c[0])"
            Write-Host " PORT     : $($c[1])"
            Write-Host " USERNAME : runneradmin"
            Write-Host " PASSWORD : P@ssw0rd!"
            Write-Host "================================"
          } else {
            Write-Host "FAILED — full log:"
            Get-Content C:\ngrok.log
            exit 1
          }
        shell: powershell

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
        shell: powershell
