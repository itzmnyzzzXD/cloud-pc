name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # v3 URL — the old 4VmDzA7iaHb URL is ngrok v2 and auth servers reject it
      - name: Download ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive -Path "$env:TEMP\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          Write-Host "Binary ready: $(Test-Path 'C:\ngrok\ngrok.exe')"
        shell: powershell

      # v3 syntax is "config add-authtoken" not "authtoken"
      - name: Auth
        run: |
          C:\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
          Write-Host "Auth applied"
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
          Write-Host "RDP enabled"
        shell: powershell

      # PassThru captures the process so we can check if it crashes
      - name: Start Tunnel
        run: |
          $proc = Start-Process `
            -FilePath "C:\ngrok\ngrok.exe" `
            -ArgumentList "tcp 3389 --log=C:\ngrok\ngrok.log --log-level=debug" `
            -NoNewWindow -PassThru
          Write-Host "ngrok PID: $($proc.Id)"
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Host "ERROR: ngrok crashed on startup — log:"
            Get-Content "C:\ngrok\ngrok.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "ngrok alive — polling API"
        shell: powershell

      - name: Get Address
        run: |
          $url = $null
          $attempts = 0
          while (-not $url -and $attempts -lt 30) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($response.tunnels.Count -gt 0) {
                $url = $response.tunnels[0].public_url
              }
            } catch {
              $attempts++
              Write-Host "Waiting... ($attempts/30)"
            }
          }
          if ($url) {
            $clean = $url -replace "tcp://", ""
            $parts = $clean.Split(":")
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "  RDP ADDRESS : $($parts[0])"
            Write-Host "  RDP PORT    : $($parts[1])"
            Write-Host "  USERNAME    : runneradmin"
            Write-Host "  PASSWORD    : P@ssw0rd!"
            Write-Host "=========================================="
          } else {
            Write-Host "Tunnel never came up — ngrok log:"
            Get-Content "C:\ngrok\ngrok.log" -Tail 30 -ErrorAction SilentlyContinue
            exit 1
          }
        shell: powershell

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
        shell: powershell
