name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download
        run: Invoke-WebRequest https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
        shell: powershell

      - name: Extract
        run: Expand-Archive ngrok.zip
        shell: powershell

      - name: Auth
        run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable TS
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        shell: powershell

      - name: Enable Firewall
        run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        shell: powershell

      - name: Set Auth
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        shell: powershell

      - name: Set Password
        run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
        shell: powershell

      # Run ngrok in the background — foreground blocks and never prints the address
      - name: Create Tunnel
        run: Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
        shell: powershell

      # Poll until ngrok API responds then print the address
      - name: Get Address
        run: |
          $url = $null
          $attempts = 0
          while (-not $url -and $attempts -lt 30) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($response.tunnels.Count -gt 0) {
                $url = $response.tunnels[0].public_url
              }
            } catch {
              $attempts++
              Write-Host "Waiting... ($attempts/30)"
            }
          }
          if ($url) {
            $clean = $url -replace "tcp://", ""
            $parts = $clean.Split(":")
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "  RDP ADDRESS : $($parts[0])"
            Write-Host "  RDP PORT    : $($parts[1])"
            Write-Host "  USERNAME    : runneradmin"
            Write-Host "  PASSWORD    : P@ssw0rd!"
            Write-Host "=========================================="
          } else {
            Write-Host "Tunnel never came up"
            exit 1
          }
        shell: powershell

      # Hold the session open
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
        shell: powershell
